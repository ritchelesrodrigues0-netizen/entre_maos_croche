<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#4d3228" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Painel | Entre Mãos Crochê</title>
    <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Nunito+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <div id="app">
      <div class="loading-block" role="status"><span class="spinner" aria-hidden="true"></span> Carregando…</div>
    </div>

    <dialog class="confirm" id="confirm" aria-labelledby="confirm-title">
      <h2 id="confirm-title"></h2>
      <p id="confirm-message"></p>
      <div class="confirm__actions">
        <button type="button" class="btn btn--ghost" id="confirm-cancel">Cancelar</button>
        <button type="button" class="btn btn--danger" id="confirm-ok">Confirmar</button>
      </div>
    </dialog>

    <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

    <script type="module" src="../js/admin.js"></script>
  </body>
</html>
